  <script>

          body: '示範頁。由眼睛、牙齒同作息講起：均衡飲食、運動、充足睡眠。'

        'daily-weather': {

      var page = pages[id] || {
        title: '示範教學頁',
        lead: '呢頁用嚟試篩選，唔係正式教材。',
        body: '搵唔到對應示範。返回清單再揀過。'
      };
      document.title = page.title + '｜科學網站分享';
      document.getElementById('demo-title').textContent = page.title;
      document.getElementById('demo-lead').textContent = page.lead;
      document.getElementById('demo-body').textContent = page.body;
    })();
